# ============================================================================================
#  Headcount - trade.yml
#  /trade <player> sends a request. The target accepts with /trade accept, or the chat link on Java, and
#  denies with /trade deny. The sender withdraws it with /trade cancel.
#  A player can only have one trade or pending request at a time, sent or received.
#
#  The trade menu's text is written here. Everything else Headcount says is in lang/en_US.yml.
# ============================================================================================
config-version: 1

request:
  # How long a request waits before it expires.
  timeout: 30s
  # Status (statuses.yml) that makes a target count as offline, so vanished staff aren't revealed.
  vanished-status: vanished

confirm:
  # Countdown between both players confirming and the trade going through. Both sides are locked meanwhile.
  # Any change to either side clears both confirmations.
  countdown: 3s

cooldown:
  # Time both players wait before their next trade. Bypass: headcount.bypass.trade.cooldown
  duration: 10s
  # Also start the cooldown when a trade is cancelled.
  after-cancel: false

range:
  # Maximum distance between the players in blocks. -1 means no limit. Bypass: headcount.bypass.trade.range
  blocks: -1
  # Both players must be in the same world.
  same-world: true

allowed-types:
  # Which kinds of trade are allowed. "Heads" are economy heads of the current cycle. Anything else, expired heads
  # included, is an "item".
  heads-for-heads: true
  items-for-heads: true
  items-for-items: true
  # Trades where one side offers nothing.
  gifts: true

limits:
  # Most item stacks one side can offer, not counting heads.
  max-items: 24
  # Most economy heads one side can offer.
  max-heads: 24
  # Players can only offer their own heads.
  only-own-heads: false
  # Materials that can never be traded.
  blocked-items: []

statuses:
  # Statuses that stop a request from being sent, checked on both players.
  # The sender sees gates.trade-send.<status> or gates.trade-send-target.<status>, depending on who has it.
  # Bypass: headcount.bypass.trade-send.<status>
  block-request:
    - in-pvp
    - combat-tagged
    - creative-or-spectator
    - sleeping-or-dead
  # Statuses that stop a request from being accepted, checked on both players.
  # Messages are gates.trade-accept.<status> and gates.trade-accept-target.<status>.
  block-accept:
    - in-pvp
    - combat-tagged
    - creative-or-spectator
    - sleeping-or-dead
  # Statuses that cancel an open trade, checked on both players every cancel.check-interval.
  # Bypass: headcount.bypass.trade-cancel.<status>
  cancel-open:
    - in-pvp
    - combat-tagged
    - creative-or-spectator
    - sleeping-or-dead

# When an open trade is cancelled, everything goes back to its owner. A trade always cancels when a player closes
# the screen, leaves, dies or changes world, and at a cycle end, a stop or a reload. range, statuses.cancel-open
# and the options below add more reasons.
cancel:
  # Also cancel when either player teleports.
  on-teleport: true
  # Teleports shorter than this many blocks, within the same world, don't cancel.
  teleport-min-distance: 0
  # Also cancel when either player's game mode changes.
  on-gamemode-change: true
  # How often open trades are checked for range, statuses and closed screens.
  check-interval: 500ms

# Save both players' inventories to disk when a trade completes, and about a second after any item moves in or
# out of an offer. A crash then can't duplicate or lose offered items.
save-player-data-after-trade: true

gui:
  # Trade window title. Every text in this menu can use <other> <seconds> <my_heads> <my_items> <their_heads>
  # <their_items> <max_heads> <max_items>
  title: "<dark_gray>Trade with <other>"
  rows: 6
  # Slots for your offer, on the left. other-slots holds the other player's offer. Both lists must be the same length.
  own-slots: [0-3, 9-12, 18-21, 27-30, 36-39, 45-48]
  other-slots: [5-8, 14-17, 23-26, 32-35, 41-44, 50-53]
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  filler-slots: empty
  buttons:
    info:
      slot: 4
      material: PLAYER_HEAD
      head: viewer
      name: "<yellow>Trading with <other>"
      lore:
        - "<gray>Your offer is on the left."
        - "<gray>Heads: <white><my_heads>/<max_heads></white> · Items: <white><my_items>/<max_items>"
        - "<gray>Their offer: <white><their_heads></white> heads, <white><their_items></white> items"
    confirm:
      slot: 13
      unconfirmed:
        material: LIME_DYE
        name: "<green>Confirm trade"
        lore: ["<gray>Both players must confirm.", "<gray>Any change clears both."]
      confirmed:
        material: LIME_CONCRETE
        name: "<green><bold>You confirmed"
        lore: ["<gray>Click to take it back."]
    other-status:
      slot: 22
      unconfirmed:
        material: GRAY_DYE
        name: "<gray><other> has not confirmed"
      confirmed:
        material: LIME_CONCRETE
        name: "<green><other> confirmed"
    countdown:
      slot: 31
      idle:
        material: GRAY_STAINED_GLASS_PANE
        name: " "
      running:
        material: CLOCK
        name: "<gold>Trading in <seconds>..."
        lore: ["<gray>Both sides are locked.", "<gray>Click confirm to stop."]
    cancel:
      slot: 40
      material: BARRIER
      name: "<red>Cancel trade"
      lore: ["<gray>Everything goes back to its owner."]
