# ============================================================================================
#  Headcount - titles.yml
#  Titles players can own and equip with /hc titles. They get them from the shop, from outcomes or from an admin.
#  Chat and tab plugins show the equipped title with %headcount_title%, and Headcount can also set it as a
#  LuckPerms or Vault prefix or suffix. The force-title action puts a title on a player for a set time.
#
#  This file holds the title names, descriptions and menu text. Headcount's own messages (command replies,
#  errors, help) are in lang/en_US.yml.
# ============================================================================================
config-version: 2

settings:
  # What %headcount_title% shows when nothing is equipped.
  none-text: ""
  # How %headcount_title% shows the equipped title. <title> is the title's display text.
  format: "<title> "
  # Equip a player's first title automatically.
  auto-equip-first: true
  # Copies the shown title into your permissions plugin as a prefix or suffix, with colors converted to
  # legacy &-codes.
  permission-prefix:
    # Turns the prefix or suffix on. A change applied with /hca reload updates online players right away, and
    # others when they next join while it is on. A prefix left over from before it was turned off has to be
    # removed with your permissions plugin.
    enabled: false
    # Whether the title is set as a prefix or a suffix.
    type: prefix
    # Priority of the prefix or suffix. Headcount clears anything else at this priority, so pick one nothing
    # else uses.
    priority: 100
    format: "<title> "

# The titles players can own. Each key (champion, collector...) is the title's ID for /hca title, the
# grant-title action and shop requirements.
#   display       what players see, in MiniMessage
#   description   lore lines in the menu
#   icon          the menu item, as an item definition (see config.yml)
#   enabled       false hides the title
titles:
  champion:
    display: "<gold>[Champion]"
    description:
      - "<gray>Finished a cycle in the top 3."
    icon: { material: GOLDEN_HELMET }
  collector:
    display: "<blue>[Collector]"
    description:
      - "<gray>Bought in the Rare shop tier."
    icon: { material: CHEST }
  legend:
    display: "<gradient:gold:yellow>[Legend]</gradient>"
    description:
      - "<gray>The rarest title in the shop."
    icon: { material: NETHER_STAR, glint: true }
  dunce:
    display: "<gray>[Dunce]"
    description:
      - "<gray>Given out by punishments."
    icon: { material: CARVED_PUMPKIN }

gui:
  # Menu title. Variables: <page>
  title: "<dark_gray>Your Titles"
  rows: 6
  # Show titles the player doesn't own, as locked.
  show-unowned: true
  title-slots: [10-16, 19-25, 28-34]
  # How each title looks in the menu, combined with the title's own 'icon'. States: owned, equipped, forced, locked.
  # Variables: <title> <id> <description>
  title-item:
    material: NAME_TAG
    name: "<title>"
    owned:
      lore: ["", "<yellow>Click to equip"]
    equipped:
      glint: true
      lore: ["", "<green>Equipped", "<yellow>Click to unequip"]
    forced:
      glint: true
      lore: ["", "<red>Forced on you for now"]
    locked:
      material: GRAY_DYE
      lore: ["", "<dark_gray>You don't own this title"]
  filler: { material: GRAY_STAINED_GLASS_PANE, name: " " }
  filler-slots: [0-9, 17, 18, 26, 27, 35, 36-53]
  buttons:
    previous-page: { slot: 45, material: ARROW, name: "<yellow>Previous page", lore: ["<gray>Page <page> of <pages>"] }
    next-page: { slot: 53, material: ARROW, name: "<yellow>Next page", lore: ["<gray>Page <page> of <pages>"] }
    unequip: { slot: 49, material: BARRIER, name: "<red>Unequip title" }
