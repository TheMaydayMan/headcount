# ============================================================================================
#  Headcount - scoring.yml
#  How each active player's end-of-cycle score is calculated. A positive score gives that many points
#  (config.yml points.earn-multiplier); a negative score triggers punishments (outcomes.yml).
#
#  Where text lives: this file holds text you design (menu titles, item names and lore, and the messages inside
#  action lists). Everything Headcount itself says (command replies, errors, confirmations, help, effect
#  descriptions) is in lang/en_US.yml.
# ============================================================================================
config-version: 1

# The formula. Normal math: + - * / % (remainder) ^ (power), parentheses, comparisons (< <= > >= == !=, which give
# 1 or 0), && || !, and "condition ? a : b".
# Functions: min(a, b, ...) max(...) avg(...) floor ceil round(x[, digits]) trunc abs sign pow(x, y) sqrt cbrt
#            exp log(x[, base]) ln log10 log2 clamp(x, low, high) if(condition, a, b) sin cos tan
# Constants: pi e true false
#
# Variables:
#   unique            unique heads in the vault (different owners; your own head counts once)
#   total             total heads in the vault, duplicates included
#   own               copies of your own head in the vault
#   duplicates        total - unique
#   vault_size        your vault slots this cycle;  vault_free  empty slots
#   starting_heads    heads every vault started with this cycle
#   active            active players this cycle;  players  everyone who has ever joined;  online  players online
#   rank              your rank among active players by unique heads (1 = most; ties share a rank)
#   percentile        your percentile among active players (100 = top, 0 = bottom)
#   unique_avg unique_median unique_max unique_min unique_sum   over active players
#   kills             kill heads you got this cycle;  deaths  kill heads others got from you
#   trades            completed trades;  heads_in / heads_out  heads received / given through trades
#   purchases         shop purchases this cycle;  points_spent  points spent this cycle
#   points            points you hold now;  points_next  points already waiting for next cycle
#   playtime          minutes played this cycle;  playtime_hours
#   streak            +N for N positive cycles in a row, -N for N negative;  streak_positive / streak_negative
#   last_score        last cycle's score (0 if none);  last_unique;  has_last  1 if there was a last score
#   bonus             score bonus from actions (added after the formula unless add-bonus-after-formula is false)
#   titles            titles you own
#   cycle             the cycle ID;  cycle_length  days;  days_elapsed / days_left
#   is_active         1 if you are active
#   %any_placeholder% any numeric PlaceholderAPI placeholder, e.g. %statistic_player_kills% (offline players
#                     resolve whatever the placeholder supports; anything non-numeric counts as 0)
#
# Default: one point per unique head, minus a quarter of the active players (rounded up). With 12 active players,
# 3 unique heads scores 0 and 10 unique heads scores 7.
formula: "unique - ceil(active / 4)"

# Other ideas (copy one into 'formula'):
#   Exponential, rewarding big collections:   floor(pow(unique, 1.5) / 2) - ceil(active / 4)
#   Percent-based, compared to everyone:      round((percentile - 50) / 10)
#   Rank-based, top 3 rewarded:               rank <= 3 ? 10 - rank * 2 : (percentile < 25 ? -3 : 0)
#   Share of all active players collected:    round(unique / max(active, 1) * 10) - 5
#   Streak bonus on top of the default:       unique - ceil(active / 4) + min(streak_positive, 3)
#   Punish hoarding your own head:            unique - ceil(active / 4) - floor(own / 10)
#   Kills matter:                             unique + kills - deaths - ceil(active / 4)

# How the formula's result becomes a whole number: floor | round | ceil
rounding: floor

# Add the 'score-bonus' action total after the formula and rounding. Set false if your formula uses 'bonus' itself.
add-bonus-after-formula: true

# How ties rank: competition (10, 10, 8 -> 1, 1, 3) or dense (10, 10, 8 -> 1, 1, 2).
rank-mode: competition

streaks:
  # A streak counts consecutive cycles with a positive score, or with a negative score.
  # When a player is inactive for a cycle: pause (keep the streak) | break (reset to 0)
  inactive: pause
  # A score of exactly 0: break | pause
  zero-score: break
