# Builds Headcount and publishes a GitHub release with the jar and its sha256, the way the releases so far were
# made by hand. Run it from the Actions tab (or the API) once the version is on main:
#   version: the version in Headcount/build.gradle.kts, like 1.1.2. The tag is v<version>.
# The release text comes from .github/release-notes/v<version>.md, which has to be committed first.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as in Headcount/build.gradle.kts (like 1.1.2)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Check the version, notes and tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -q "^version = \"$VERSION\"$" Headcount/build.gradle.kts || { echo "Headcount/build.gradle.kts isn't version $VERSION"; exit 1; }
          test -s ".github/release-notes/v$VERSION.md" || { echo "No .github/release-notes/v$VERSION.md"; exit 1; }
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "Release v$VERSION already exists"; exit 1; fi

      - name: Build and run the unit tests
        working-directory: Headcount
        run: ./gradlew build --no-daemon

      - name: Publish the release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd Headcount/build/libs
          JAR="Headcount-$VERSION.jar"
          test -f "$JAR" || { echo "$JAR wasn't built"; ls; exit 1; }
          sha256sum "$JAR" > "$JAR.sha256"
          cat "$JAR.sha256"
          gh release create "v$VERSION" "$JAR" "$JAR.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Headcount $VERSION" --notes-file "$GITHUB_WORKSPACE/.github/release-notes/v$VERSION.md"
