# ============================================================================================
#  Headcount - outcomes.yml
#  What happens to each active player at the end of a cycle, based on their score. Inactive players get no
#  score, so no outcomes either.
#
#  Each rule has:
#    score:       a range, like "..-1" for -1 or lower, "-4..-1", "10.." for 10 or more, "5", ">=3", "<0"
#    conditions:  optional extra requirements such as streak, rank or statuses, as in actions.yml
#    actions:     an action list, or the name of one from actions.yml
#    display:     the rule's name in reports and history
#    punishment:  true if a shield should block it. Defaults to true when the whole score range is below 0.
#    group:       rules compete within their group (default: punishments or rewards)
#    priority:    higher wins in most-extreme mode (default: how far the range is from 0)
#    enabled:     false switches the rule off
#
#  Variables in outcome actions: <player> <score> <unique> <total> <own> <rank> <percentile> <streak>
#  <points_earned> <points> <rolled_over> <cycle> <tier> <playtime> <kills> <deaths> <trades> <outcome>
# ============================================================================================
config-version: 1

# Which matching rules a player gets: all | most-extreme
# all gives every rule the score matches. most-extreme gives only the most extreme match in each group, so a
# player who qualifies for Wanted gets that and not the two lighter penalties as well.
mode: most-extreme

rules:
  # ---------------------------------------------------------------- punishments
  # Punishments climb with repeat offences, not with the size of the score. With the default formula a player who
  # never trades scores -3 at worst, so one bad cycle costs a minor penalty. Two in a row bring the Penalty, and
  # three make a player Wanted. The score conditions catch very low scores from score-bonus actions or a harsher
  # formula.
  minor:
    display: "<yellow>Minor penalty"
    score: "..-1"
    actions: punish-mild

  penalty:
    display: "<gold>Penalty"
    score: "..-1"
    priority: 3
    conditions:
      expression: "score <= -4 || streak <= -2"
    actions: punish-medium

  wanted:
    display: "<red>Wanted"
    score: "..-1"
    priority: 6
    conditions:
      expression: "score <= -6 || streak <= -3"
    actions: punish-severe

  # Bans a player for a day after four negative cycles in a row, one more than Wanted. Off by default.
  ban-repeat-offenders:
    enabled: false
    display: "<dark_red>Temporary ban"
    score: "..-1"
    group: bans
    conditions:
      streak: "<=-4"
    actions:
      - type: ban
        reason: "Four negative Headcount cycles in a row"
        duration: 1d

  # Bans a player permanently for a score of -25 or lower. Off by default.
  ban-extreme:
    enabled: false
    display: "<dark_red>Banned"
    score: "..-25"
    group: bans
    actions:
      - type: ban
        reason: "Extreme Headcount score"

  # ---------------------------------------------------------------- rewards outside the shop
  # The top three get 3 points. They also need to be in the top half, so on a server of two or three players
  # finishing "third" isn't a prize.
  top-three:
    display: "<gold>Top 3"
    score: "1.."
    group: top
    punishment: false
    conditions:
      rank: "1..3"
      expression: "percentile >= 50"
    actions: reward-top

  # First place gets the Champion title. Players tied for first all get it.
  champion:
    display: "<gold>Champion"
    score: "1.."
    group: champion
    punishment: false
    conditions:
      rank: "1"
      expression: "percentile >= 50"
    actions:
      - message: "<gold>You finished cycle <cycle> in first place."
      - type: grant-title
        title: champion

  # A small, flat thank-you for staying positive. It doesn't grow with the streak, so it can't snowball.
  streak-bonus:
    display: "<aqua>Streak bonus"
    score: "1.."
    group: streak
    conditions:
      streak: ">=3"
    actions:
      - message: "<aqua><streak> good cycles in a row. Here are 2 extra points."
      - points:
          amount: 2
          when: now
