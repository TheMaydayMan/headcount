# ============================================================================================
#  Headcount - shop.yml
#  The /hc shop menu. Players earn points from a positive score at the end of a cycle and spend them during the
#  next one. Each tier has its own pages and unlocks when the player's score from the previous cycle reaches its
#  threshold. Players can still browse a locked tier. Its entries show their locked look, and a banner shows the
#  score needed.
# ============================================================================================
config-version: 2

settings:
  # Price at which a purchase asks for confirmation first. An entry can override this with confirm: true or false.
  # 10 is about what a good cycle earns, so a purchase that takes that much asks first.
  confirm-at-price: 10
  # Last-cycle score for players who don't have one, because they are new or were inactive.
  new-player-score: 0
  # When global stock refills: cycle | never
  stock-reset: cycle

gui:
  # Menu title.
  # Variables: <tier> <tier_id> <tier_number> <tiers> <page> <pages> <points> <last_score> <threshold> <needed>
  title: "<dark_gray>Shop » <tier> <dark_gray>(<points> pts)"
  rows: 6
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  filler-slots: [0-9, 17, 18, 26, 27, 35, 36-53]
  buttons:
    previous-tier:
      slot: 45
      material: SPECTRAL_ARROW
      name: "<yellow>« <target_tier>"
    next-tier:
      slot: 53
      material: SPECTRAL_ARROW
      name: "<yellow><target_tier> »"
    previous-page:
      slot: 48
      material: ARROW
      name: "<yellow>Previous page"
      lore: ["<gray>Page <page> of <pages>"]
    next-page:
      slot: 50
      material: ARROW
      name: "<yellow>Next page"
      lore: ["<gray>Page <page> of <pages>"]
    info:
      slot: 49
      material: SUNFLOWER
      name: "<gold><points> points"
      lore:
        - "<gray>Tier: <tier> <dark_gray>(<tier_number>/<tiers>)"
        - "<gray>Your last cycle score: <white><last_score>"
        - "<gray>You earn points with a positive score."
    close:
      slot: 46
      material: BARRIER
      name: "<red>Close"
    locked-banner:
      slot: 4
      material: IRON_BARS
      name: "<red>Locked: <tier>"
      lore:
        - "<gray>Needs a last cycle score of <white><threshold></white> or more."
        - "<gray>Yours was <white><last_score></white> (<white><needed></white> more needed)."

# Confirmation menu for expensive purchases. The entry being bought is shown in the 'display' slot.
confirm-gui:
  title: "<dark_gray>Buy <name>? <price> points"
  rows: 3
  filler: { material: GRAY_STAINED_GLASS_PANE, name: " " }
  filler-slots: empty
  buttons:
    confirm:
      slots: [10, 11, 12]
      material: LIME_CONCRETE
      name: "<green>Buy for <price> points"
      lore: ["<gray>You have <points> points."]
    cancel:
      slots: [14, 15, 16]
      material: RED_CONCRETE
      name: "<red>Cancel"
    display:
      slot: 13

# Default look of entries in each state. An entry's own 'display' and 'display-states' override these.
# The states are affordable, too-expensive, sold-out and locked, plus three optional ones. If left out,
# limit-reached looks like sold-out, and cooldown and unavailable look like too-expensive.
# Variables: <name> <price> <points> <missing> <stock> <purchases_left> <limit> <bought> <cooldown> <tier> <threshold>
default-states:
  affordable:
    lore:
      - "<gray>Price: <gold><price> points"
      - "<gray>Stock: <white><stock></white> · Left for you this cycle: <white><purchases_left>"
      - ""
      - "<green>Click to buy"
  too-expensive:
    lore:
      - "<gray>Price: <red><price> points"
      - "<red>You need <missing> more points."
  sold-out:
    material: BARRIER
    lore:
      - "<gray>Price: <gold><price> points"
      - "<red>Sold out"
  limit-reached:
    lore:
      - "<gray>Price: <gold><price> points"
      - "<red>You reached the limit of <limit> for this cycle."
  cooldown:
    lore:
      - "<gray>Price: <gold><price> points"
      - "<red>Available again in <cooldown>."
  unavailable:
    lore:
      - "<gray>Price: <gold><price> points"
      - "<red>You don't meet the requirements for this."
  locked:
    material: GRAY_DYE
    glint: false
    lore:
      - "<dark_gray>Locked"
      - "<gray>Needs a last cycle score of <white><threshold>"

# The shop's tiers, in order. A tier with 'threshold: none' is always unlocked.
# Tier settings: name, threshold (a last-cycle score, or none), pages (the minimum; entries can add more),
# enabled and entries.
# Entry settings:
#   name                 the entry's name in messages (default: its display name without formatting)
#   enabled              false hides it
#   page, slot           where it goes (page starts at 1)
#   price                in points
#   display              item definition (material, name, lore, item-model, glint, enchants, custom ...)
#   display-states       per-state overrides (affordable, too-expensive, sold-out, locked, limit-reached, cooldown, unavailable)
#   actions              what a purchase does
#   limit-per-cycle      purchases per player per cycle, 0 for no limit
#   stock                global stock, -1 for unlimited
#   cooldown             time between purchases per player
#   conditions           extra requirements (see actions.yml)
#   requires             titles: [..], purchases: [entry or tier.entry, ever], purchases-this-cycle: [..], permissions: [..]
#   confirm              force the confirmation menu on (true) or off (false)
# The default prices assume a positive score of about 3 to 10 points a cycle, more for the best players on big
# servers. With half of unspent points carried over, Common and Uncommon are everyday buys, Rare takes a good cycle
# and Legendary takes a few cycles of saving.
tiers:
  # Everyday supplies, and insurance against a bad cycle.
  common:
    name: "<white>Common"
    threshold: none
    entries:
      steak:
        slot: 10
        price: 1
        display:
          material: COOKED_BEEF
          name: "<white>16 Steak"
        actions:
          - type: give-item
            material: COOKED_BEEF
            amount: 16
      speed:
        slot: 12
        price: 2
        limit-per-cycle: 3
        display:
          material: SUGAR
          name: "<aqua>Speed for 30 minutes"
          lore: ["<gray>Counts only time you're online."]
        actions:
          - type: potion
            effect: speed
            amplifier: 0
            duration: 30m
            time: online
            stacking: extend
            start-message: "<aqua>Speed for <duration>."
            end-message: "<gray>Your speed boost wore off."
      extra-heads:
        slot: 14
        price: 3
        limit-per-cycle: 2
        display:
          material: PLAYER_HEAD
          head: viewer
          name: "<yellow>+3 starting heads next cycle"
          lore: ["<gray>Three more of your own heads to trade.", "<gray>Useful when you have more people", "<gray>to trade with than heads."]
        actions:
          - type: next-cycle
            starting-heads: "+3"
          - message: "<yellow>You will start next cycle with 3 more heads."
      shield:
        slot: 16
        price: 4
        limit-per-cycle: 1
        display:
          material: SHIELD
          name: "<gold>Punishment shield"
          lore: ["<gray>Blocks your next punishment.", "<gray>Lasts through the next two cycle ends."]
        actions:
          - type: shield
            charges: 1
            duration: cycles:2
            start-message: "<gold>A shield protects you from your next punishment."

  # Tools for playing the game better.
  uncommon:
    name: "<green>Uncommon"
    threshold: 3
    entries:
      haste:
        slot: 10
        price: 3
        display:
          material: GOLDEN_PICKAXE
          name: "<green>Haste II for 1 hour"
          lore: ["<gray>Counts only time you're online."]
        actions:
          - type: potion
            effect: haste
            amplifier: 1
            duration: 1h
            time: online
      head-protection:
        slot: 12
        price: 4
        limit-per-cycle: 1
        display:
          material: TOTEM_OF_UNDYING
          name: "<green>Head protection"
          lore: ["<gray>The next 2 times you're killed this", "<gray>cycle, your head doesn't drop."]
        actions:
          - type: head-protection
            charges: 2
            duration: cycle
            start-message: "<green>Your head won't drop the next 2 times you're killed this cycle."
      rollover:
        slot: 14
        price: 3
        limit-per-cycle: 1
        display:
          material: CLOCK
          name: "<green>Keep 25% more points"
          lore: ["<gray>When this cycle ends, keep 75% of", "<gray>your unspent points instead of 50%."]
        actions:
          - type: rollover
            add: 25
          - message: "<green>You'll keep 25% more of your unspent points when this cycle ends."
      mystery:
        slot: 16
        price: 4
        display:
          material: ENDER_CHEST
          name: "<green>Mystery box"
          lore: ["<gray>Golden apples, diamonds, bottles", "<gray>o' enchanting, or an 8-point jackpot."]
        actions: mystery-box

  # Status, and room to grow on a big server.
  rare:
    name: "<blue>Rare"
    threshold: 6
    entries:
      title-headhunter:
        slot: 10
        price: 6
        limit-per-cycle: 1
        conditions:
          expression: "kills >= 3"
        display:
          material: IRON_SWORD
          name: "<blue>Title: Headhunter"
          lore: ["<gray>Take 3 heads in fights this cycle", "<gray>to unlock it."]
          flags: [HIDE_ATTRIBUTES]
        actions:
          - type: grant-title
            title: headhunter
            equip: true
      title-collector:
        slot: 12
        price: 8
        limit-per-cycle: 1
        display:
          material: NAME_TAG
          name: "<blue>Title: Collector"
        actions:
          - type: grant-title
            title: collector
            equip: true
      bigger-vault:
        slot: 14
        price: 6
        limit-per-cycle: 1
        display:
          material: CHEST
          name: "<blue>+9 vault slots next cycle"
          lore: ["<gray>Only helps on a server big enough", "<gray>to fill 27 slots with different heads."]
        actions:
          - type: next-cycle
            vault-size: "+9"
          - message: "<blue>Your vault grows by 9 slots next cycle."
      diamonds:
        slot: 16
        price: 10
        stock: 5
        display:
          material: DIAMOND_BLOCK
          name: "<blue>Diamond block"
          lore: ["<gray>5 for the whole server each cycle."]
          glint: true
        actions:
          - type: give-item
            material: DIAMOND_BLOCK
            amount: 1

  # Prestige. These take a few good cycles of saving.
  legendary:
    name: "<gold>Legendary"
    threshold: 9
    entries:
      totem:
        slot: 10
        price: 10
        limit-per-cycle: 1
        display:
          material: TOTEM_OF_UNDYING
          name: "<gold>Totem of Undying"
        actions:
          - type: give-item
            material: TOTEM_OF_UNDYING
            amount: 1
      blessing:
        slot: 12
        price: 8
        cooldown: 1d
        display:
          material: BEACON
          name: "<gold>Champion's blessing"
          lore: ["<gray>Strength, Resistance and Regeneration", "<gray>for 30 minutes of play. Once a day."]
        actions:
          - type: potion
            effect: strength
            amplifier: 0
            duration: 30m
            time: online
            start-message: "<gold>You're blessed for <duration>."
          - type: potion
            effect: resistance
            amplifier: 0
            duration: 30m
            time: online
          - type: potion
            effect: regeneration
            amplifier: 0
            duration: 30m
            time: online
            end-message: "<gray>Your blessing wore off."
      elytra:
        slot: 14
        price: 20
        stock: 1
        display:
          material: ELYTRA
          name: "<gold>Elytra"
          lore: ["<gray>One for the whole server each cycle."]
        actions:
          - type: give-item
            material: ELYTRA
            amount: 1
      title-legend:
        slot: 16
        price: 25
        display:
          material: NETHER_STAR
          name: "<gold>Title: Legend"
          lore: ["<gray>Needs the Collector title."]
          glint: true
        requires:
          titles: [collector]
        actions:
          - type: grant-title
            title: legend
            equip: true
          - celebrate
