    ended: "<prefix><green>Cycle ended and the next one started."
    started: "<prefix><green>Cycle started."
    already-running: "<prefix><red>A cycle is already running. End it with /hca cycle end confirm."
    cannot: "<prefix><red>That can't be done right now."
    end-changed: "<prefix><green>The cycle now ends <end>."
    simulate-header: "<prefix><gold>Simulated end of cycle <cycle>, nothing changed: <active> active, average <average>, <rewarded> rewarded, <punished> punished."
    simulate-line: "<gray><rank>. <white><name></white> <unique> unique, score <yellow><score></yellow>, points <points>, outcomes: <outcomes>"
  heads:
    given: "<prefix><green>Gave <amount> of <owner>'s heads to <player> (<in_vault> into the vault)."
    queued: "<prefix><green>Queued <amount> of <owner>'s heads for <player>'s vault next cycle."
  points:
    done: "<prefix><green><player> now has <points> points (<points_next> next cycle)."
  title:
    unknown: "<prefix><red>No title named <title>."
    granted: "<prefix><green>Granted <title> to <player>."
    revoked: "<prefix><green>Revoked <title> from <player>."
  effects:
    header: "<prefix><gray><player> has <count> active effect(s):"
    line: "<gray>- <dark_gray>[<id>]</dark_gray> <white><description></white> <gray>(<remaining>, <state>, from <source>)"
    removed: "<prefix><green>Removed effect <id>."
    removed-all: "<prefix><green>Removed <count> effect(s) from <player>."
    not-found: "<prefix><red>No effect ID starts with <id>."
  reset:
    confirm: "<prefix><red>This resets <what> for <player>. <gray>Add 'confirm' to the command."
    done: "<prefix><green>Reset <what> for <player>."
    cycle-confirm: "<prefix><red>This restarts cycle <cycle> from now. Every vault is refilled and all heads made so far stop counting (<old_heads>). Kills, activity, shop limits and warnings reset, while points, titles, streaks, history and effects stay. <gray>To go ahead, run /hca reset cycle <args> confirm"
    old-heads-delete: "deleted wherever they turn up"
    old-heads-keep: "kept as defunct heads"
    cycle-done: "<prefix><green>Cycle <cycle> started over. It now ends <end>."
    # Sent to every online player. Empty to send nothing.
    cycle-broadcast: "<prefix><yellow>An admin restarted cycle <cycle>. Your vault was refilled, and heads from before the restart no longer count."
    hard-disabled: "<prefix><red>Hard reset is turned off (reset.hard.enabled in config.yml)."
    hard-warning: "<prefix><dark_red><bold>HARD RESET</bold></dark_red> <red>deletes ALL Headcount data and starts again from cycle 1: <players> players, <cycles> cycles, <heads> heads in vaults, <points> points, <titles> titles, <results> results and <effects> active effects. Old heads are <old_heads>. Config files are kept."
    hard-step: "<prefix><red>Confirmation <step>/<steps>: type <white>/hca reset hard <code></white> within <seconds>s."
    hard-final: "<prefix><dark_red><bold>Last confirmation</bold></dark_red> <red>(<step>/<steps>). This cannot be undone. Type <white>/hca reset hard <code></white> within <seconds>s."
    hard-wrong-code: "<prefix><red>Wrong code, so the hard reset was cancelled. Start again with /hca reset hard."
    hard-expired: "<prefix><red>That code expired, so the hard reset was cancelled. Start again with /hca reset hard."
    hard-done: "<prefix><green>Hard reset done. Backup: <backup>."
    # Sent to every online player. Empty to send nothing.
    hard-broadcast: "<prefix><yellow>An admin reset Headcount. Everything starts over."
