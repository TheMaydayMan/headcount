# ============================================================================================
#  Headcount - integrations.yml
#  Who handles each job that other plugins can do. Every job has a 'provider':
#
#    included   the built-in version, with nothing else to install. It is the default wherever it exists.
#    <plugin>   hand the job to that plugin, which must be installed.
#    none       turn the job off, including the built-in version.
#
#  If the chosen plugin is missing or fails to load, Headcount logs a warning and uses 'included', or 'none'
#  where there is no built-in version. /hca integrations shows what is in use right now.
#  Changes apply after /hca reload, except switching /pvp between plugins, which needs a restart.
#  With auto-switch on (below), Headcount also changes providers here itself when plugins are added or removed.
#
#  This file only holds settings. Player messages, like the PvP and AFK notices, are in lang/en_US.yml. How
#  those messages reach the player (chat, action bar, title, sound) is set here.
# ============================================================================================
config-version: 3

# Switch providers here automatically when plugins are added or removed, checked at each server start:
#   - a plugin that wasn't installed at the last start takes the jobs it can do, unless a job already belongs to
#     another plugin that is still installed. On the first start with a new integrations.yml, every installed
#     plugin counts as new.
#   - a plugin that is gone hands its jobs to another installed plugin that can do them, or back to 'included'
#     ('none' where there is no built-in version).
# Each change is written into this file, comments kept, with a line in the console saying what changed and how to
# undo it. A change you undo stays undone until that plugin is removed and added again. A few plugins are never
# picked on their own: Vault for permissions, EssentialsX for moderation, and Vault for money unless an economy
# plugin is registered with it. The full rules are in docs/integrations.md.
# false: providers only change when you change them.
auto-switch: true

# --------------------------------------------------------------------------------------------
#  PvP: the PvP toggle, the combat tag and new-player protection. These feed the in-pvp, combat-tagged and
#  newbie-protected statuses (statuses.yml) used by the default vault and trade rules, and the pvp action.
# --------------------------------------------------------------------------------------------
pvp:
  # Which plugin handles PvP: included | pvpmanager | none
  #   included:   the built-in PvP, set up under 'included' below. It owns the /pvp command.
  #   pvpmanager: PvPManager does all of it, and the 'included' settings are ignored.
  #   none:       no PvP handling. Players can always fight, as in vanilla, and the PvP statuses read false.
  #               combat-tagged falls back to "hit by or hit a player in the last 15s" (statuses.yml).
  provider: included

  # ---- Built-in PvP (provider: included) ----
  included:
    toggle:
      # PvP for players who never used /pvp: on | off
      # If it is off, players opt in with /pvp before they can fight or be hit. That also keeps the default vault and
      # trade rules, which block players with PvP on, out of their way.
      default: "off"
      # Players can switch their own PvP with /pvp. They also need headcount.pvp, which everyone has by default.
      allow-toggle: true
      # Time between two switches. Bypass: headcount.bypass.pvp.cooldown
      cooldown: 10s
      # Put everyone back to the default each time they join.
      reset-on-join: false
      # Worlds where PvP is always on for everyone, by exact world name. force-off-worlds keeps it off.
      force-on-worlds: []
      force-off-worlds: []

    newbie-protection:
      # How long new players are protected after their first join, in real time. 0 turns it off.
      # Protected players can't attack or be attacked.
      duration: 10m
      # A protected player can end it early with /pvp on.
      can-end-early: true

    respawn-protection:
      # How long nobody can hurt a player after they respawn. Attacking someone ends it. 0 turns it off.
      duration: 5s

    combat-tag:
      # Turns on the combat tag. A hit between two players puts them in combat (the combat-tagged status) for
      # 'duration', and each new hit starts it over. A player's arrows, tridents, thrown potions, TNT and tamed pets
      # count as their hits.
      enabled: true
      duration: 15s
      # Tag the player who hits.
      tag-attacker: true
      # Tag the player who is hit.
      tag-victim: true
      # End the tag when the player dies.
      untag-on-death: true
      # While in combat:
      block-pvp-toggle: true       # can't turn PvP off
      block-flight: true           # flying stops and can't start again (never affects creative or spectator)
      block-elytra: false          # can't start gliding
      block-ender-pearls: false    # can't throw ender pearls
      block-teleport: true         # teleports by commands and plugins (/spawn, /home, /tpa...) fail
      # Commands that can't be used in combat, written without the slash. Namespaced forms like essentials:home are
      # blocked too. Bypass for these and for teleports: headcount.bypass.combat-commands
      blocked-commands: [spawn, home, homes, warp, warps, tpa, tpahere, tpaccept, tpyes, back, rtp, wild, ec, enderchest, hub, lobby]

    combat-log:
      # Punish players who leave the server in combat. Kicks and bans don't count. Bypass: headcount.bypass.combat-log
      enabled: true
      # What happens to the player who left: kill | none
      # kill makes them die as they leave, so their items and XP drop where they stood. none only runs 'actions'
      # and 'broadcast' below.
      punishment: kill
      # Give the kill to the player who last hit them, along with the kill head drop (config.yml kills).
      credit-last-attacker: true
      # Extra actions to run on the player who left. Any action from actions.yml works. Actions that need the
      # player online wait until they next join. For example:
      #   actions:
      #     - type: points
      #       amount: -5
      #     - message: "<red>You logged out during a fight and lost 5 points."
      actions: []
      # Tell everyone else. The message is pvp.combat-log-broadcast in the lang file.
      broadcast: true

    # How each kind of PvP message reaches the player. The texts are in lang/en_US.yml under pvp.
    #   channel: chat | actionbar | title | none
    #   sound:   a sound key like "minecraft:block.note_block.bass", or "" for none. volume and pitch: 0-2.
    # A player gets the same message at most once a second.
    messages:
      # /pvp switched your PvP (pvp.toggled-on, toggled-off and newbie-ended).
      toggled:
        channel: chat
        sound: "minecraft:ui.button.click"
      # You hit someone or were hit, and are now in combat (pvp.tag-start).
      tag-start:
        channel: actionbar
        sound: "minecraft:item.armor.equip_iron"
      # Your combat tag ended (pvp.tag-end).
      tag-end:
        channel: actionbar
        sound: ""
      # Your hit was stopped because you or the other player has PvP off or is protected (pvp.blocked-hit.*).
      blocked-hit:
        channel: actionbar
        sound: ""
      # Something you tried was refused, like a blocked command or teleport, or /pvp during combat or a cooldown.
      blocked-action:
        channel: chat
        sound: "minecraft:block.note_block.bass"
        pitch: 0.7
      # The live countdown while in combat (pvp.countdown): actionbar | bossbar | none
      countdown: actionbar
      # Boss bar color when countdown is bossbar: pink | blue | red | green | yellow | purple | white
      countdown-bossbar-color: red

  # ---- Pet protection (provider: included or pvpmanager) ----
  # Tamed animals (wolves, cats, parrots, horses, donkeys, llamas...) share their owner's PvP: a player can only hurt
  # someone else's pet if the two players could fight. That means the attacker's and the owner's PvP are on and
  # neither is protected as a new player, and the owner didn't just respawn. Hits, projectiles, fire, harmful
  # potions and the player's own pets all count. Owners can always hurt their own pets, and players with
  # headcount.pvp.override (or PvPManager's override) can hurt any. It uses the rules of whichever provider is chosen
  # above, and does nothing with provider: none. Hurting a pet doesn't put anyone in combat.
  # The message goes through messages.blocked-hit above, also with PvPManager. Texts: pvp.blocked-pet in the lang
  # file, and pvp.blocked-hit.self-* when the attacker is the one who can't fight.
  # For pet vengeance instead (PvP on for whoever hurts a pet), see hooks.player.hurt-pet in config.yml.
  pet-protection:
    enabled: false
    # Pets whose owner is offline: protect | allow
    # An offline player can't be fought, so protect keeps their pets safe until they're back.
    offline-owners: protect

  # ---- PvPManager (provider: pvpmanager) ----
  pvpmanager:
    # Let every player use PvPManager's /pvp.
    # PvPManager keeps its pvpmanager.command.pvp permission from players by default, and they start with PvP on.
    # Headcount's default rules block moving heads and trading while PvP is on, so players need a way to turn it
    # off. This sets the permission's default to true. Anyone your permissions plugin explicitly denies stays
    # denied. Set false to hand out the permission yourself.
    let-players-toggle: true

# --------------------------------------------------------------------------------------------
#  Placeholders: %...% in Headcount's text, the score formula and statuses.
# --------------------------------------------------------------------------------------------
placeholders:
  # Which placeholders work: included | placeholderapi | none
  #   included:       only Headcount's %headcount_...% placeholders (listed in docs/placeholders.md).
  #   placeholderapi: those plus every PlaceholderAPI placeholder, and %headcount_...% for other plugins.
  #   none:           no %...% placeholders at all, not even Headcount's. They show as written.
  provider: included
  placeholderapi:
    # Register the %headcount_...% expansion, so other plugins like scoreboards, tab and chat can show Headcount's data.
    register-expansion: true
    # How formatted values like %headcount_title% are passed to other plugins: legacy | minimessage | plain
    expansion-format: legacy

# --------------------------------------------------------------------------------------------
#  Money, for the money action. Points are Headcount's own currency and need nothing.
# --------------------------------------------------------------------------------------------
economy:
  # Which economy the money action uses: vault | none
  # Headcount has no money of its own, so the default content gives none out. With Vault and an economy plugin like
  # EssentialsX or CMI installed, set vault to use the money action. auto-switch sets it when Vault is added and an
  # economy plugin has registered with it by the time Headcount starts.
  provider: none

# --------------------------------------------------------------------------------------------
#  Permissions: the permission, group, primary-group, track, prefix and suffix actions, and title prefixes
#  (titles.yml permission-prefix).
# --------------------------------------------------------------------------------------------
permissions:
  # Which plugin handles permissions: included | luckperms | vault | none
  #   included:  Headcount sets permission nodes itself, saves them and re-applies them on every join. It can't do
  #              groups, tracks, prefixes or suffixes, so those actions are skipped with a warning.
  #   luckperms: everything, with LuckPerms' own expiry on timed changes.
  #   vault:     through Vault's permission API. Groups, prefixes and suffixes need a Vault chat plugin.
  #   none:      every permission action is skipped.
  provider: included
  luckperms:
    # Give timed changes LuckPerms' own expiry too, so they still end if Headcount is removed.
    use-expiry: true
    # "server" context for the nodes Headcount adds. Leave empty for global.
    server-context: ""

# --------------------------------------------------------------------------------------------
#  Moderation: the ban, mute, kick, warn and jail actions.
# --------------------------------------------------------------------------------------------
moderation:
  # Which plugin handles moderation: included | litebans | libertybans | advancedban | essentials | commands | none
  #   included:    vanilla bans (the server's ban list), kicks, warnings sent as a message, and the built-in mute
  #                and jail set up below.
  #   commands:    any moderation plugin, driven by the command templates under 'commands'.
  #   none:        every moderation action is skipped.
  # If a plugin can't do one kind, like jail in LibertyBans and LiteBans, that kind goes to 'included'.
  provider: included
  # A different provider for single kinds, with the same choices. For example, bans by LibertyBans but jail by
  # EssentialsX:
  #   kinds:
  #     jail: essentials
  # The kinds are ban, mute, kick, warn and jail. Kinds left out, or set to default, use 'provider'. auto-switch
  # sets a kind back to default when its plugin is removed.
  kinds: {}
  # Name shown as the punisher, where the plugin supports it.
  operator-name: Headcount
  # Hide punishment broadcasts, if the plugin allows it.
  silent: false

  # The built-in jail, used by 'included' and for jail with any plugin that has none.
  included-jail:
    # Jail location as world,x,y,z[,yaw,pitch], like "world,0,64,0". Jail actions don't work until it is set.
    location: ""
    # Jailed players who get further away than this many blocks are pulled back.
    radius: 8
    # Where release sends them: previous | spawn
    release-to: previous
    # Commands jailed players can still use. Everything else is blocked.
    allowed-commands: [msg, tell, r, hc, headcount]
  # The built-in mute, used by 'included'. It blocks chat and these commands.
  included-mute:
    blocked-commands: [msg, tell, w, r, me, say]

  # Commands used for LiteBans, since its API can't create punishments.
  # Variables: <player> <uuid> <reason> <duration>
  litebans-commands:
    ban: "litebans:ban <player> <reason>"
    tempban: "litebans:tempban <player> <duration> <reason>"
    unban: "litebans:unban <player>"
    mute: "litebans:mute <player> <reason>"
    tempmute: "litebans:tempmute <player> <duration> <reason>"
    unmute: "litebans:unmute <player>"
    kick: "litebans:kick <player> <reason>"
    warn: "litebans:warn <player> <reason>"
  # Command templates for provider 'commands'. Leave a kind empty if your plugin can't do it, and 'included'
  # handles it instead.
  # Variables: <player> <uuid> <reason> <duration> <jail>
  commands:
    ban: "ban <player> <reason>"
    tempban: ""
    unban: "pardon <player>"
    mute: ""
    tempmute: ""
    unmute: ""
    kick: "kick <player> <reason>"
    warn: ""
    jail: ""
    tempjail: ""
    unjail: ""

# --------------------------------------------------------------------------------------------
#  Discord, for the discord action.
# --------------------------------------------------------------------------------------------
discord:
  # Which plugin sends Discord messages: discordsrv | none
  # discordsrv needs DiscordSRV installed and connected to a bot. auto-switch sets it when DiscordSRV is added.
  provider: none
  # DiscordSRV game channel for actions that don't name one.
  default-channel: global

# --------------------------------------------------------------------------------------------
#  Custom items: item definitions written as "custom: itemsadder:ns:id", "custom: oraxen:id", "custom: nexo:id".
# --------------------------------------------------------------------------------------------
items:
  # Custom item plugins to use, out of itemsadder, oraxen and nexo. Ones that aren't installed are skipped, and []
  # turns custom items off. List the ones you install, like [itemsadder]. auto-switch adds a plugin here when it's
  # added to the server and takes it out when it's removed.
  providers: []

# --------------------------------------------------------------------------------------------
#  Bedrock players, through Geyser. They get /trade accept instead of the chat link, and every menu and the
#  sidebar work for them. This also feeds the bedrock status.
# --------------------------------------------------------------------------------------------
bedrock:
  # How Bedrock players are recognized: floodgate | geyser | none
  # floodgate also knows players who have no Java account. Set it, or geyser, when Geyser is installed.
  # auto-switch picks floodgate if both are added at once.
  provider: none

# --------------------------------------------------------------------------------------------
#  Player states: afk, vanished, god, jailed and muted, for the player-state status source (the afk and vanished
#  statuses in statuses.yml).
# --------------------------------------------------------------------------------------------
player-state:
  # Which plugin reports player states: included | essentials | none
  #   included:   AFK after 'afk.after' without activity, and vanished from the "vanished" flag most vanish
  #               plugins set. God mode comes from the player's invulnerable flag. Jailed and muted come from the
  #               built-in jail and mute, or from the moderation plugin when it can tell.
  #   essentials: EssentialsX's own /afk, /vanish, /god, jail and mute.
  #   none:       all five read false.
  provider: included
  included:
    afk:
      # How long a player goes without moving, looking around, chatting, using commands or clicking before they
      # are AFK. 0 means never.
      after: 5m
      # Count turning the camera as activity.
      looking-counts: true
      # Who is told when someone goes AFK or comes back: self | everyone | none
      # The messages are player-state.* in the lang file.
      announce: self
