# ============================================================================================
#  Headcount - outcomes.yml
#  What happens to each ACTIVE player at the end of a cycle, based on their score. (Inactive players get no
#  score and no outcomes.)
#
#  Each rule has:
#    score:       a range, e.g. "..-1" (-1 or lower), "-4..-1", "10.." (10 or more), "5", ">=3", "<0"
#    conditions:  optional extra requirements (streak, rank, statuses, expression ... see actions.yml)
#    actions:     an action list (or the name of one from actions.yml)
#    display:     how the rule is named in reports and history
#    punishment:  true if a shield should block it (default: true when the whole score range is below 0)
#    group:       rules compete within their group (default: punishments or rewards)
#    priority:    optional; higher wins in most-extreme mode (default: how far the range is from 0)
#    enabled:     false to switch a rule off
#
#  Variables in outcome actions: <player> <score> <unique> <total> <own> <rank> <percentile> <streak>
#  <points_earned> <points> <rolled_over> <cycle> <tier> <playtime> <kills> <deaths> <trades> <outcome>
# ============================================================================================
config-version: 1

# all: a player gets every rule their score matches.
# most-extreme: only the most extreme matching rule in each group (a -12 gets "severe", not all three).
mode: most-extreme

rules:
  # ---------------------------------------------------------------- punishments (mild by default)
  penalty-1:
    display: "<yellow>Minor penalty"
    score: "..-1"
    actions: punish-mild

  penalty-5:
    display: "<gold>Penalty"
    score: "..-5"
    actions: punish-medium

  penalty-10:
    display: "<red>Severe penalty"
    score: "..-10"
    actions: punish-severe

  # Repeated failure: a ban for three negative cycles in a row. Disabled by default; enable with care.
  ban-repeat-offenders:
    enabled: false
    display: "<dark_red>Temporary ban"
    score: "..-1"
    group: bans
    conditions:
      streak: "<=-3"
    actions:
      - type: ban
        reason: "Three negative Headcount cycles in a row"
        duration: 1d

  # A permanent ban for extreme scores. Disabled by default.
  ban-extreme:
    enabled: false
    display: "<dark_red>Banned"
    score: "..-25"
    group: bans
    actions:
      - type: ban
        reason: "Extreme Headcount score"

  # ---------------------------------------------------------------- rewards outside the shop
  top-three:
    display: "<gold>Top 3"
    score: "1.."
    group: top
    punishment: false
    conditions:
      rank: "1..3"
    actions: reward-top

  streak-bonus:
    display: "<aqua>Streak bonus"
    score: "1.."
    group: streak
    conditions:
      streak: ">=3"
    actions:
      - message: "<aqua><streak> good cycles in a row! +3 starting heads next cycle."
      - type: next-cycle
        starting-heads: "+3"
