name: Headcount
version: '${version}'
main: com.gradychastain.headcount.HeadcountPlugin
api-version: '26.3'
description: Collect player heads each cycle. Your score at the end decides whether you get shop points or a punishment.
author: Grady Chastain
website: https://github.com/TheMaydayMan/headcount
load: POSTWORLD
libraries:
  - org.xerial:sqlite-jdbc:3.50.3.0
softdepend:
  - PvPManager
  - PlaceholderAPI
  - Vault
  - LuckPerms
  - Essentials
  - LiteBans
  - AdvancedBan
  - LibertyBans
  - DiscordSRV
  - ItemsAdder
  - Oraxen
  - Nexo
  - Geyser-Spigot
  - floodgate

commands:
  headcount:
    description: Open your head vault, or run a Headcount subcommand.
    aliases: [hc]
    usage: /<command> [shop|titles|points|score|top|history|sidebar|effects|help]
  trade:
    description: Trade heads and items with another player.
    usage: /<command> <player>|accept|deny|cancel
    permission: headcount.trade
  pvp:
    description: Turn your PvP on or off. Only works when integrations.yml pvp.provider is included.
    usage: /<command> [on|off|status] | /<command> <player> [on|off]
    permission: headcount.pvp
  hcadmin:
    description: Headcount admin commands.
    aliases: [hca]
    usage: /<command> help
    permission: headcount.admin

permissions:
  headcount.*:
    description: All player and admin permissions. Bypasses and hard reset are separate.
    default: op
    children:
      headcount.player: true
      headcount.admin: true
  headcount.player:
    description: All player commands.
    default: true
    children:
      headcount.vault: true
      headcount.shop: true
      headcount.titles: true
      headcount.points: true
      headcount.score: true
      headcount.top: true
      headcount.history: true
      headcount.sidebar: true
      headcount.effects: true
      headcount.help: true
      headcount.trade: true
      headcount.pvp: true
  headcount.vault:
    description: Open your head vault with /hc.
    default: true
  headcount.shop:
    description: Open the shop with /hc shop.
    default: true
  headcount.titles:
    description: Open the titles menu with /hc titles.
    default: true
  headcount.points:
    description: Check your points with /hc points.
    default: true
  headcount.score:
    description: Preview your score with /hc score.
    default: true
  headcount.top:
    description: See the leaderboard with /hc top.
    default: true
  headcount.history:
    description: View your past cycles with /hc history.
    default: true
  headcount.sidebar:
    description: Toggle the Headcount sidebar with /hc sidebar.
    default: true
  headcount.effects:
    description: List your active effects with /hc effects.
    default: true
  headcount.help:
    description: Show help with /hc help.
    default: true
  headcount.trade:
    description: Trade with other players using /trade.
    default: true
  headcount.pvp:
    description: Turn your own PvP on or off with /pvp (included PvP).
    default: true
  headcount.admin:
    description: All admin commands except /hca reset hard.
    default: op
    children:
      headcount.admin.cycle: true
      headcount.admin.vault: true
      headcount.admin.vault.edit: true
      headcount.admin.heads: true
      headcount.admin.points: true
      headcount.admin.titles: true
      headcount.admin.history: true
      headcount.admin.effects: true
      headcount.admin.reset: true
      headcount.admin.reset.cycle: true
      headcount.admin.trade: true
      headcount.admin.audit: true
      headcount.admin.reload: true
      headcount.admin.debug: true
      headcount.admin.run: true
      headcount.admin.notify: true
      headcount.pvp.others: true
  headcount.admin.cycle:
    description: View, end, start and simulate the cycle, and change when it ends.
    default: op
  headcount.admin.vault:
    description: View any player's vault.
    default: op
  headcount.admin.vault.edit:
    description: Edit any player's vault.
    default: op
  headcount.admin.heads:
    description: Give economy heads.
    default: op
  headcount.admin.points:
    description: Give, take or set points.
    default: op
  headcount.admin.titles:
    description: Grant or revoke titles.
    default: op
  headcount.admin.history:
    description: View any player's history.
    default: op
  headcount.admin.effects:
    description: List or remove any player's active effects.
    default: op
  headcount.admin.reset:
    description: Reset a player's Headcount data.
    default: op
  headcount.admin.reset.cycle:
    description: Restart the current cycle with /hca reset cycle. Also needs headcount.admin.reset.
    default: op
  headcount.admin.reset.hard:
    description: Delete all Headcount data with /hca reset hard. Also needs headcount.admin.reset. It isn't part of headcount.admin, and the console always has it.
    default: op
  headcount.admin.trade:
    description: Cancel any trade.
    default: op
  headcount.admin.audit:
    description: Search the audit log.
    default: op
  headcount.admin.reload:
    description: Reload the config files.
    default: op
  headcount.admin.debug:
    description: Inspect statuses, flags, held heads and placeholders.
    default: op
  headcount.admin.run:
    description: Run action lists and hooks on players, for testing.
    default: op
  headcount.admin.notify:
    description: Get admin alerts, such as duplicate heads and errors.
    default: op
  headcount.pvp.others:
    description: See and set other players' PvP with /pvp <player> [on|off] (included PvP).
    default: op
  headcount.pvp.override:
    description: Attack anyone, even players with PvP off or protection (included PvP).
    default: false
  headcount.bypass.pvp.cooldown:
    description: Toggle PvP without waiting for the cooldown (included PvP).
    default: false
  headcount.bypass.combat-log:
    description: Leave while in combat without the combat-log punishment (included PvP).
    default: false
  headcount.bypass.combat-commands:
    description: Use blocked commands and teleports while in combat (included PvP).
    default: false
  headcount.bypass.*:
    description: Skip every status gate and every trade and combat restriction.
    default: false
    children:
      headcount.bypass.pvp.cooldown: true
      headcount.bypass.combat-log: true
      headcount.bypass.combat-commands: true
