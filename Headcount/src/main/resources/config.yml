# ============================================================================================
#  Headcount - config.yml
#  General settings, the cycle, the vault, heads, kills, points, the sidebar and hooks.
#
#  Other files:
#    statuses.yml      named player states (in PvP, combat tagged, ...) that the other files refer to
#    trade.yml         /trade rules and the trade screen
#    scoring.yml       the score formula and streaks
#    actions.yml       reusable named action lists
#    outcomes.yml      end-of-cycle rewards and punishments
#    shop.yml          the points shop
#    titles.yml        titles players can own and equip
#    integrations.yml  which other plugins handle what
#    lang/en_US.yml    every message players see
#
#  Text uses MiniMessage (https://docs.advntr.dev/minimessage/format) and placeholders:
#    <name>               a variable for that particular text (listed next to each option)
#    %headcount_<name>%   any Headcount placeholder (works without PlaceholderAPI)
#    %other_placeholder%  any PlaceholderAPI placeholder, when PlaceholderAPI is installed
#
#  Durations accept 30s, 10m, 2h, 3d, 1w, combinations like 1h30m, or a plain number of seconds.
#  Changes apply after /hca reload unless a comment says otherwise. /hca selftest checks every item, menu,
#  message and list.
#
#  Quick start: the settings most servers change first
#    cycle.length-days, cycle.start-date, cycle.end-time, cycle.time-zone     when cycles run
#    vault.size, vault.starting-heads                                          how big the game is
#    activity.min-playtime                                                     who counts as active
#    scoring.yml formula                                                       what a score is worth
#    outcomes.yml, shop.yml                                                    rewards, punishments, the shop
#    integrations.yml                                                          PvP, permissions, moderation...
#
#  Item definitions (any 'material:' item here and in the other files: menu buttons, shop displays, give-item...):
#    material           a Minecraft material like DIAMOND_SWORD, or use custom: instead
#    name, lore         MiniMessage text (lore is a list)
#    amount             stack size
#    max-stack-size     1-99
#    glint              true/false enchantment shine
#    enchants           {sharpness: 3, unbreaking: 2}
#    unbreakable        true/false
#    flags              [HIDE_ENCHANTS, HIDE_ATTRIBUTES, ...]
#    item-model         namespace:key, for resource packs
#    custom-model-data  a number
#    head               viewer | <player name> | <uuid>, for PLAYER_HEAD items
#    custom             itemsadder:ns:id | oraxen:id | nexo:id (see integrations.yml items)
#    pdc                {namespace:key: value} persistent data, so other plugins can recognize the item
#
#  Menus (vault.gui, history.gui, and the menus in trade.yml, shop.yml and titles.yml):
#    title         the window title
#    rows          1-6
#    filler        an item definition for empty slots
#    filler-slots  a list like [0-8, 45-53], or: empty (every free slot) | border (the outer ring) | none
#    buttons.<id>  an item definition plus slot: N or slots: [..]. enabled: false hides the button.
#    Slots are numbered from 0 in the top-left corner, left to right, 9 per row.
#
#  Menu titles, item names and lore, and the messages in action lists are written in these config files.
#  Everything else Headcount says is in lang/en_US.yml.
# ============================================================================================
config-version: 3

general:
  # Language file in plugins/Headcount/lang/, without .yml.
  language: en_US
  # Date format for messages, as a Java DateTimeFormatter pattern. Dates show in the cycle time zone.
  date-format: "yyyy-MM-dd HH:mm z"
  time-units:
    # How many units a duration shows: 2 gives "3d 4h" and 3 gives "3d 4h 12m".
    # Unit names are in the lang file.
    shown: 2

storage:
  # SQLite database file in plugins/Headcount/. Every change is saved as it happens.
  file: headcount.db

# --------------------------------------------------------------------------------------------
#  Cycle
# --------------------------------------------------------------------------------------------
cycle:
  # Length of a cycle in days. A change takes effect at the next cycle or the next /hca reset cycle. The running
  # cycle keeps its end.
  # Two weeks gives a player who logs on twice a week four or five sessions to trade in, and still ends often enough
  # that rewards and punishments feel tied to what they did.
  length-days: 14
  # The day the first cycle starts, as YYYY-MM-DD, or "auto" to start right away, lined up to end-time today.
  # Until a future date arrives, no cycle runs.
  start-date: auto
  # Time of day cycles roll over, as 24-hour HH:MM.
  end-time: "00:00"
  # Time zone for start-date and end-time. Use a region like America/Denver or Europe/London (follows daylight
  # saving), an abbreviation like MST or CET (a fixed offset all year, so MST is always UTC-7), an offset like
  # GMT-7 or UTC+5:30, or "system".
  # If the server was offline at a rollover, the next start ends the stored cycle and starts the one that should be
  # running now. The cycle number goes up by one at each end. /hca reset cycle keeps the number and /hca reset hard
  # starts again at 1. /hca cycle info also shows the current cycle's internal run ID.
  time-zone: UTC

activity:
  # Playtime in a cycle needed to count as active. 0 means joining once is enough.
  # Only active players get a score, points and outcomes. Two hours keeps someone who drops in for a look from being
  # scored, and punished, before they've had a chance to trade.
  min-playtime: 2h
  # How often playtime is saved and the active threshold checked.
  check-interval: 30s

# --------------------------------------------------------------------------------------------
#  Head vault (/hc)
# --------------------------------------------------------------------------------------------
vault:
  # Slots in each vault. Up to 54 fits on one screen. Bigger vaults are split into pages of 45.
  # Size and starting heads change at the start of the next cycle or at a /hca reset cycle.
  size: 27
  # How many of their own heads each player starts a cycle with, up to the vault size. Extra starting heads from
  # next-cycle actions, like a shop purchase, are given as items if they don't fit.
  # Each trade costs one of these, so they are what a player spends. 18 is enough to trade with everyone on a server
  # of up to 18 active players. On bigger servers the keenest traders run short and buy heads with items, take them in fights,
  # or buy more in the shop. The 9 empty slots also show a new player where the other heads go.
  starting-heads: 18
  # Largest size the next-cycle vault-size action can grow a vault to.
  max-size: 270
  block-movement:
    # Statuses (statuses.yml) that stop a player moving heads in or out of their vault.
    # Each one has its own message, gates.vault-move.<status> in the lang file, and its own bypass permission,
    # headcount.bypass.vault-move.<status>. Put ! before a status to block while it is NOT active.
    statuses:
      - in-pvp
      - combat-tagged
      - creative-or-spectator
      - sleeping-or-dead
    # Whether the same statuses also stop the vault from opening. If false, blocked players can still open it and
    # look. Messages are gates.vault-open.<status> and the bypass is headcount.bypass.vault-open.<status>.
    block-opening: false
  # Whether the drop key (Q) on a vault slot drops the head on the ground. Normally players take it out first.
  allow-drop-key: false
  # Whether a head whose ID is already in a vault can go in another one: reject | allow
  # A second head with the same ID can only be a copy, usually from creative cloning.
  duplicate-insert: reject
  # Save the player's inventory to disk shortly after a vault change, so a crash can't roll back just one side.
  save-player-data-after-change: true
  gui:
    # Vault window title. Variables: <owner> <unique> <total> <size> <used> <page> <pages> <score>.
    # <score> is the owner's score if the cycle ended now, or ? while the owner is offline. It uses score-colors
    # below, or write <score:green:red:gray> to pick the positive, negative and zero colors right there. Any
    # MiniMessage color or tag works, like #ff8800 or gold.
    # The title updates while the vault is open.
    title: "<dark_gray><owner>'s Head Vault <gray>(<unique> unique, score <score>)"
    score-colors:
      positive: green
      negative: red
      zero: gray
    # Slots past the vault size on the last row.
    locked-slot:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    # The bottom row of paged vaults (more than 54 slots).
    filler:
      material: GRAY_STAINED_GLASS_PANE
      name: " "
    filler-slots: [45-53]
    buttons:
      previous-page:
        slot: 45
        material: ARROW
        name: "<yellow>Previous page"
        lore: ["<gray>Page <page> of <pages>"]
      next-page:
        slot: 53
        material: ARROW
        name: "<yellow>Next page"
        lore: ["<gray>Page <page> of <pages>"]
      info:
        slot: 49
        material: PLAYER_HEAD
        head: viewer
        name: "<gold><owner>'s vault"
        lore:
          - "<gray>Unique heads: <white><unique>"
          - "<gray>Total heads: <white><total> / <size>"
          - "<gray>Score if the cycle ended now: <score>"

# --------------------------------------------------------------------------------------------
#  Economy heads
# --------------------------------------------------------------------------------------------
heads:
  item:
    # Name of a current economy head. Variables for the name and lore: <owner> <owner_uuid> <cycle>
    # <current_cycle> <head_id> <head_id_short> <created> <source>
    name: "<yellow><owner>'s Head"
    lore:
      - "<gray>Cycle <gold><cycle></gold> economy head"
      - "<dark_gray>Keep it in your vault: /hc"
      - "<dark_gray>ID <head_id_short>"
    # Name of a head from an older cycle. It keeps its data and works as a normal head, but it's worthless.
    expired-name: "<gray><owner>'s Head <dark_gray>(expired)"
    expired-lore:
      - "<red>Expired</red> <dark_gray>- from cycle <gray><cycle></gray>"
      - "<dark_gray>No longer counts and cannot go in a vault."
    # Name of a defunct head, one made before a reset that kept the old heads (keep-heads).
    defunct-name: "<gray><owner>'s Head <dark_gray>(defunct)"
    defunct-lore:
      - "<red>Defunct</red> <dark_gray>- cycle <gray><cycle></gray> was reset"
      - "<dark_gray>No longer counts and cannot go in a vault."
    # Stack size for heads, 1-99. At 1, every head keeps its own slot. Each head has a unique ID either way.
    max-stack-size: 1
    # Enchantment glint on current heads.
    glint: false
    # Item model (namespace:key) for resource packs. Leave empty for the normal head.
    item-model: ""
  placed:
    # Keep economy data on heads placed as blocks, and give it back whenever the block drops as an item again.
    preserve: true
    # What breaking a head block in creative does: destroy | drop
    # destroy drops nothing, like vanilla. drop gives the head back anyway.
    creative-break: destroy
    # Drop an economy head block that was removed without dropping anything, like from an explosion or a plugin.
    always-drop: true
    # How to treat head blocks with economy data that Headcount never saw placed: strip | allow
    # These come from world editor copies or copied block data. strip turns them into plain heads and logs them as
    # duplicates. allow trusts them.
    untracked-blocks: strip

duplicates:
  # Message admins with headcount.admin.notify when a duplicated head ID is found.
  notify-admins: true
  # Remove extra copies found in an inventory. The copy already in a vault is kept. If false, copies are only flagged.
  remove-copies: false
  # Check a player's inventory for duplicates whenever they close any inventory.
  scan-on-inventory-close: true

# --------------------------------------------------------------------------------------------
#  Kills
# --------------------------------------------------------------------------------------------
kills:
  # Killing a player drops a new head of the victim where they died.
  # The head is made fresh, not taken from their vault, and it drops even with keepInventory on. The killer is
  # whoever vanilla credits, so projectiles and knocking someone into lava count. Suicide gives nothing.
  enabled: true
  # Only one head per killer per victim per cycle.
  once-per-victim-per-cycle: true
  # Heads dropped per kill. extra-heads actions add to this.
  heads-per-kill: 1
  # Worlds where kills drop nothing.
  disabled-worlds: []
  # Statuses on the killer that stop a drop, like creative-or-spectator.
  killer-blocked-statuses: []
  # How long only the killer can pick up the head. 0 lets anyone.
  killer-pickup-only: 15s

# --------------------------------------------------------------------------------------------
#  Points (Headcount's own currency, not Vault money)
# --------------------------------------------------------------------------------------------
points:
  # Percent of unspent points kept when a cycle ends. The rest are gone.
  # A positive score gives points at the end of a cycle, to spend during the next one. At 50, savings level off at
  # about twice what a player earns in a cycle, so saving for a Legendary item works but a lead can't grow forever.
  rollover-percent: 50
  # Points per score point, rounded down. With 1.0 a score of 7 gives 7 points.
  earn-multiplier: 1.0
  # Let balances go below zero when points are taken.
  allow-negative: false

# --------------------------------------------------------------------------------------------
#  Messages, menus, placeholders
# --------------------------------------------------------------------------------------------
gates:
  # Minimum time between two "you can't do that while ..." messages to the same player.
  message-cooldown: 1s

gui:
  # Minimum time between two clicks in any Headcount menu. It stops fast clicks from buying something twice.
  click-cooldown: 150ms

placeholders:
  # Text that true/false placeholders show, such as the status placeholders and active.
  true-text: "yes"
  false-text: "no"

top:
  # Lines shown by /hc top.
  lines: 10
  # How often the live leaderboard refreshes. It feeds /hc top, %headcount_top_...% and ranks in previews.
  refresh-interval: 30s

history:
  gui:
    # History window title. Variables: <player> <page>
    title: "<dark_gray><player>'s History"
    rows: 6
    entry-slots: [0-44]
    # The item for each past cycle. Variables: <cycle> <unique> <total> <own> <score> <earned> <spent>
    # <rolled_over> <points_after> <streak> <rank> <outcomes> <playtime> <kills> <deaths> <trades> <ended> <player>
    entry:
      material: PAPER
      name: "<yellow>Cycle <cycle>"
      lore:
        - "<gray>Ended: <white><ended>"
        - "<gray>Unique heads: <white><unique>"
        - "<gray>Score: <white><score> <dark_gray>(rank <rank>)"
        - "<gray>Points earned: <green><earned></green>, spent: <red><spent>"
        - "<gray>Streak: <white><streak>"
        - "<gray>Outcomes: <outcomes>"
      positive: { material: LIME_DYE }
      negative: { material: RED_DYE }
      zero: { material: GRAY_DYE }
      inactive:
        material: GRAY_STAINED_GLASS_PANE
        lore: ["<dark_gray>Not active this cycle"]
    filler: { material: GRAY_STAINED_GLASS_PANE, name: " " }
    filler-slots: [45-53]
    buttons:
      previous-page: { slot: 45, material: ARROW, name: "<yellow>Newer", lore: ["<gray>Page <page> of <pages>"] }
      next-page: { slot: 53, material: ARROW, name: "<yellow>Older", lore: ["<gray>Page <page> of <pages>"] }
      close: { slot: 49, material: BARRIER, name: "<red>Close" }

# --------------------------------------------------------------------------------------------
#  Sidebar
# --------------------------------------------------------------------------------------------
sidebar:
  # Turns Headcount's sidebar on for the server. Set false to show Headcount's placeholders in another
  # scoreboard plugin instead. Players toggle their own with /hc sidebar.
  enabled: true
  # Whether the sidebar starts shown for a player's first join. Players who already joined keep their choice.
  # It shows a new player their unique heads and score changing as they trade, which teaches the game fastest.
  shown-for-new-players: true
  # How often the lines are redrawn.
  update-interval: 1s
  title: "<gold><bold>HEADCOUNT"
  # Sidebar lines, up to 15. Headcount and PlaceholderAPI placeholders both work.
  lines:
    - "<dark_gray>Cycle %headcount_cycle%"
    - " "
    - "<gray>Unique heads: <yellow>%headcount_unique%"
    - "<gray>Score now: <yellow>%headcount_score%"
    - "<gray>Points: <gold>%headcount_points%"
    - "<gray>Streak: <white>%headcount_streak_text%"
    - " "
    - "<gray>Ends in: <white>%headcount_time_left%"
  lines-before-start:
    - "<gray>Headcount starts in"
    - "<white>a little while"

# --------------------------------------------------------------------------------------------
#  Audit log (plugins/Headcount/audit/)
# --------------------------------------------------------------------------------------------
audit:
  enabled: true
  folder: audit
  # Size in MB at which a log file rotates, at least 0.0625 (64 KB). Files also rotate daily.
  max-file-size-mb: 10
  # Delete files older than this many days. 0 keeps them forever. Checked on start, on reload and each new day.
  keep-days: 90
  # Gzip finished files.
  compress-old-files: true
  # Also print every audit line to the console.
  also-log-to-console: false
  # Log every head moving in or out of a vault.
  log-vault-moves: true
  # Log each head made at cycle start on its own line, instead of one summary line.
  log-each-cycle-start-head: true
  # Lines per page in /hca audit.
  search-page-size: 10
  # Turn single event types off. All are on by default.
  types:
    head-create: true
    head-delete: true
    head-place: true
    head-break: true
    head-destroyed: true
    vault-in: true
    vault-out: true
    vault-admin: true
    vault-reject: true
    trade-request: true
    trade-start: true
    trade-complete: true
    trade-cancel: true
    trade-return: true
    kill-drop: true
    cycle-start: true
    cycle-end: true
    score: true
    outcome: true
    points: true
    shop-purchase: true
    action-apply: true
    action-revert: true
    title: true
    admin: true
    duplicate: true
    item-delivery: true
    gui-item-removed: true

# --------------------------------------------------------------------------------------------
#  Resets (/hca reset cycle, /hca reset hard)
# --------------------------------------------------------------------------------------------
reset:
  # Whether a reset deletes the heads made before it, when the command doesn't say delete-heads or keep-heads.
  # Old heads are worthless either way: they can't go in a vault and never count.
  #   true:   they are deleted wherever Headcount finds them - inventories and ender chests at the reset and on
  #           join, containers when opened, items picked up or dropped, and queued deliveries.
  #   false:  they stay as defunct heads (heads.item.defunct-name and defunct-lore).
  # Each reset stores its choice, so changing this later doesn't affect earlier resets.
  delete-old-heads: true
  hard:
    # Allow /hca reset hard, which deletes every player's Headcount data and starts again from cycle 1. Config
    # files are kept. It needs the headcount.admin.reset.hard permission, which the console always has.
    enabled: true
    # How many new random codes the admin types to confirm, at least 1.
    confirmations: 3
    # Time to type each code.
    confirm-timeout: 60s
    # Copy the database to plugins/Headcount/backups/hard-reset-<time>/ first.
    backup-database: true
    # Move the audit log files there too, so the audit log starts empty.
    archive-audit-log: true

# --------------------------------------------------------------------------------------------
#  Hooks: action lists that run at set moments in the cycle and when players join.
#  Each list uses the actions system. actions.yml has every type and the common options.
#
#  Cycle hooks (cycle-start, cycle-end and each warning) have two parts. cycle-start also runs after
#  /hca reset cycle.
#    global:      runs once for the server, with cycle-wide variables
#    per-player:  runs once for each player, with their own variables
#      players:   all | active | inactive | online
#      offline:   deliver (store it and run it when they next join) | skip
#      expire-after-cycles: stored hooks older than this many cycles are dropped
#      actions:   the list
#
#  Global variables: <cycle> <cycle_start> <cycle_end> <time_left> <cycle_length> <active> <players>
#    cycle-end adds: <average_score> <rewarded> <punished> <top_list> <top_N_name> <top_N_unique> <top_N_score>
#  Per-player variables at cycle-end: <player> <unique> <total> <own> <score> <rank> <percentile> <streak>
#    <streak_text> <points_earned> <points> <rolled_over> <tier> <outcomes> <playtime> <kills> <deaths> <trades>
#
#  Player hooks (player:) run for one player. When several run on the same join, they go in this order:
#  delivered per-player cycle hooks, first-join, first-join-cycle, became-active, join.
#  Variables: <player> <cycle> <time_left> <points> <streak> <streak_text>
# --------------------------------------------------------------------------------------------
hooks:
  # Delay before join hooks run, so their messages come after the join message.
  join-delay: 1s
  # How late a warning can still fire if its moment passed while the server was offline.
  missed-warning-grace: 5m
  # How many players <top_list> lists.
  top-count: 3

  cycle-start:
    global:
      - message: "<gold><bold>Cycle <cycle> has begun!</bold> <gray>Every vault was refilled. It ends <white><cycle_end></white>."
      - sound: "minecraft:ui.toast.challenge_complete"
    per-player:
      players: online
      offline: skip
      actions: []

  cycle-end:
    global:
      - message:
          - "<gold><bold>Cycle <cycle> is over!</bold>"
          - "<gray>Top players:"
          - "<top_list>"
          - "<gray>Active: <white><active></white> · Average score: <white><average_score></white> · Rewarded: <green><rewarded></green> · Punished: <red><punished>"
    per-player:
      players: all
      offline: deliver
      expire-after-cycles: 1
      actions:
        - type: message
          conditions: { active: true }
          text:
            - "<gold>Your cycle <cycle> report"
            - "<gray>Unique heads: <white><unique></white> (rank <rank>)"
            - "<gray>Score: <white><score>"
            - "<gray>Points earned: <green><points_earned></green> · Points now: <gold><points>"
  # Shortest time between two runs of a player hook for the same player, for the hooks that follow something the
  # player did (hurt-pet, kill-pet, open-trapped-chest below). Every hit on a pet and every opening of a trapped
  # chest counts, so without a wait a player could get the same message many times a second. 0 runs it every time.
  # A hook skipped by its cooldown runs none of its actions, so give timed actions like pvp a longer duration than
  # this. /hca hook ignores it.
  cooldowns:
    hurt-pet: 10s
    kill-pet: 0s
    open-trapped-chest: 10s
            - "<gray>Streak: <white><streak_text>"
            - "<gray>Shop tier unlocked: <white><tier>"
            - "<gray>Outcomes: <outcomes>"
        - type: message
          conditions: { active: false }
          text: "<gray>You were not active in cycle <cycle>, so you got no score this time."

  # Warnings before the end of a cycle. Each one needs 'before', how long before the end it fires.
  warnings:
    3d:
      before: 3d
      global:
        - message: "<yellow>Cycle <cycle> ends in <white>3 days</white>. Fill your vault with unique heads! <gray>/hc"
    1d:
      before: 1d
      global:
        - message: "<yellow>Cycle <cycle> ends in <white>1 day</white>."
    1h:
      before: 1h
      global:
        - message: "<gold>Cycle <cycle> ends in <white>1 hour</white>!"
    10m:
      before: 10m
      global:
        - message: "<gold>Cycle <cycle> ends in <white>10 minutes</white>!"
    1m:
      before: 1m
      global:
        - type: title
          title: "<red>1 minute left"
          subtitle: "<gray>Cycle <cycle> is about to end"
        - type: bossbar
          text: "<red>Cycle <cycle> ends in <white><countdown_clock>"
          color: red
          countdown-to: cycle-end

  player:
    # Runs the first time a player ever joins. The shield means a new player's first bad cycle teaches them the rules
    # instead of punishing them.
    first-join:
      - message:
          - "<gold>Welcome to <bold>Headcount</bold>!"
          - "<gray>Your vault, <yellow>/hc</yellow>, starts each cycle with <white>%headcount_starting_heads%</white> of your own heads. Trade them with <yellow>/trade</yellow> for other players' heads. Every different head in your vault when the cycle ends adds to your score."
          - "<gray>A good score earns points for <yellow>/hc shop</yellow>. A bad one brings a punishment. <yellow>/hc help</yellow> has the rest."
      - type: shield
        charges: 1
        duration: cycles:2
        start-message: "<gold>You start with a shield. It blocks your first punishment."
    first-join-cycle:
      - message: "<gold>Cycle <cycle></gold> <gray>is running: <white><time_left></white> left. You have <gold><points></gold> points to spend in <yellow>/hc shop</yellow>."
    became-active:
      - message: "<gray>You've played enough to count this cycle. When it ends, your vault becomes your score: <yellow>/hc score</yellow> shows it now."
    join: []
    # The hooks below run on a player who did something to someone else. Players in creative or spectator are left
    # out, and so is anything another plugin blocked, like a protected claim or pet-protection in integrations.yml.
    # They also have <world> <x> <y> <z>, where it happened. hooks.cooldowns above sets how often each can run.
    #
    # hurt-pet: the player hurt another player's tamed animal (a wolf, cat, parrot, horse, donkey, llama...) with a
    # hit, a projectile, TNT, a potion or their own pet. A pet's owner hurting it doesn't count.
    # Variables: <owner> (the pet's owner) <owner_uuid> <pet> (its name, or its kind in each player's language)
    # <pet_type> (like wolf) <damage>
    # Pet vengeance: the attacker's PvP is turned on and locked for 10 minutes, so the owner can fight back. Each
    # new hit after the cooldown restarts the 10 minutes.
    #   hurt-pet:
    #     - type: pvp
    #       state: "on"
    #       lock: true
    #       duration: 10m
    #       start-message: "<red>You hurt <owner>'s <pet>, so your PvP is on for <duration>."
    hurt-pet: []
    # kill-pet: the player killed another player's tamed animal. Same variables as hurt-pet, without <damage>.
    # The killing hit also runs hurt-pet.
    kill-pet: []
    # open-trapped-chest: the player opened a trapped chest. Minecraft doesn't record who placed a chest, so this
    # runs for every trapped chest, the player's own included. Use it for traps, like PvP for anyone who opens one:
